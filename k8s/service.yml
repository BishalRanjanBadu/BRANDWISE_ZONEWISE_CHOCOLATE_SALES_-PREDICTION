apiVersion: v1
kind: Service
metadata:
  name: chocolate-svc
  namespace: chocolate-prod
  # NO aws-load-balancer-* annotations.
  #
  # `aws-load-balancer-type: "external"` tells the in-tree AWS cloud provider to
  # SKIP this Service and hand it to the AWS Load Balancer Controller — an add-on
  # that `eksctl create cluster` does NOT install. Without that controller the
  # Service sits at EXTERNAL-IP <pending> forever, with a single
  # "EnsuringLoadBalancer" event and no error anywhere.
  #
  # Bare `type: LoadBalancer` uses the built-in provider and creates a Classic
  # ELB, which works on a stock eksctl cluster. If you later install the AWS Load
  # Balancer Controller, re-add the NLB annotations then — not before.
spec:
  type: LoadBalancer
  selector: { app: chocolate-api }
  ports:
    # ONE Service, therefore ONE load balancer, therefore ONE bill.
    # Both ports are actually served; an exposed port nothing listens on
    # leaves a permanently unhealthy target.
    - { name: http, port: 80,   targetPort: 8000, protocol: TCP }
    - { name: ui,   port: 8501, targetPort: 8501, protocol: TCP }